<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>

  </head>

  <body>
    <header class="divider" id="header">
    </header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
        <p class="form-intro">Complete the form below to place your order and finish checkout.</p>

        <div class="checkout-summary" id="checkout-summary"></div>

        <form class="account-form" id="checkout-form" novalidate>
          <div class="form-row">
            <label for="first-name">First Name</label>
            <input id="first-name" name="firstName" type="text" autocomplete="given-name" required />
          </div>

          <div class="form-row">
            <label for="last-name">Last Name</label>
            <input id="last-name" name="lastName" type="text" autocomplete="family-name" required />
          </div>

          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="form-row">
            <label for="address">Shipping Address</label>
            <input id="address" name="address" type="text" autocomplete="street-address" required />
          </div>

          <div class="form-row">
            <label for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required />
          </div>

          <div class="form-row">
            <label for="state">State / Province</label>
            <input id="state" name="state" type="text" autocomplete="address-level1" required />
          </div>

          <div class="form-row">
            <label for="postal-code">Postal Code</label>
            <input id="postal-code" name="postalCode" type="text" autocomplete="postal-code" required />
          </div>

          <div class="form-row">
            <label for="country">Country</label>
            <input id="country" name="country" type="text" autocomplete="country-name" required />
          </div>

          <div class="form-row">
            <label for="card-name">Cardholder Name</label>
            <input id="card-name" name="cardName" type="text" autocomplete="cc-name" required />
          </div>

          <div class="form-row">
            <label for="card-number">Card Number</label>
            <input id="card-number" name="cardNumber" type="text" autocomplete="cc-number" inputmode="numeric" required />
          </div>

          <div class="form-row">
            <label for="expiry">Expiration Date (MM/YY)</label>
            <input id="expiry" name="expiry" type="text" autocomplete="cc-exp" placeholder="MM/YY" required />
          </div>

          <div class="form-row">
            <label for="cvc">CVC</label>
            <input id="cvc" name="cvc" type="text" autocomplete="cc-csc" inputmode="numeric" required />
          </div>

          <div class="form-message hide" id="checkout-message"></div>

          <button type="submit">Place Order</button>
        </form>
      </section>

      <form class="checkout-form" name="checkout">
        <fieldset>
          <legend>Customer Name</legend>
      
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="fname" required />
      
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lname" required />
        </fieldset>
      
        <fieldset>
          <legend>Address</legend>
      
          <label for="streetAddress">Street Address</label>
          <input type="text" id="streetAddress" name="street" required />
      
          <label for="city">City</label>
          <input type="text" id="city" name="city" required />
      
          <label for="state">State</label>
          <input type="text" id="state" name="state" required />
      
          <label for="zipCode">Zip Code</label>
          <input type="text" id="zipCode" name="zip" required />
        </fieldset>
      
        <fieldset>
          <legend>Payment</legend>
      
          <label for="cardNumber">Credit Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber"
            inputmode="numeric"
            pattern="^(?:\d\s*){16}$" 
            minlength="16" 
            maxlength="19" 
            required 
            title="Please enter a 16-digit card number (spaces allowed)." />
      
          <label for="expirationDate">Expiration Date</label>
          <input type="text" id="expirationDate" name="expiration" 
            placeholder="MM/YY" 
            maxlength="5" 
            pattern="(0[1-9]|1[0-2])\/[0-9]{2}" 
            required
            title="Please enter a valid expiration date in MM/YY format"/>
      
          <label for="securityCode">Security Code</label>
          <input type="text" id="securityCode" name="code" 
            inputmode="numeric"
            minlength="3" 
            maxlength="3"
            required />
        </fieldset>

        <section class="order-summary">
          <h3>Order Summary</h3>
          <p>Items: <span id="num-items">0</span></p>
          <p>Subtotal: <span id="cartTotal">$0.00</span></p>
          <p>Tax: <span id="tax">$0.00</span></p>
          <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
          <p>Order Total: <span id="orderTotal">$0.00</span></p>
        </section>
      
        <button type="submit">Checkout</button>
      </form>
    </main>

    <footer id="footer">
    </footer>
  </body>
</html>
